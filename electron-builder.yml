appId: com.naiwa.practice
productName: 奶蛙
asar: true
electronDist: output/electron-runtime45
directories:
  output: release/0.4.0
files:
  - dist/**/*
  - desktop/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  signExecutable: false
nsis:
  artifactName: Naiwa-${version}-Setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 奶蛙
  uninstallDisplayName: 奶蛙 0.4.0
